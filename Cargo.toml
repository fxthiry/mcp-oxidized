[package]
name = "mcp-oxidized"
version = "2.0.0"
edition = "2024"
license = "Apache-2.0"
description = "MCP server for Oxidized network device configuration backup system"
repository = "https://github.com/fxthiry/mcp-oxidized"
homepage = "https://github.com/fxthiry/mcp-oxidized"
documentation = "https://docs.rs/mcp-oxidized"
readme = "README.md"
keywords = ["mcp", "oxidized", "network", "backup", "configuration"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
async-trait = "0.1.89"
moka = { version = "0.12.12", features = ["future"] }
urlencoding = "2.1.3"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.12.0", features = ["server", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
similar = "2.7.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
serial_test = "3.2.0"
tempfile = "3.23.0"
wiremock = "0.6.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
